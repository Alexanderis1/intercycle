[project]
name = "intercycle"
version = "0.1.0"
description = "Learned machine-cycle and traffic windows, broadcast over BLE to visiting inspection robots"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "astropy", "pyyaml", "pydantic>=2", "pynacl", "pandas", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest"]
phases = ["stumpy"]                         # optional matrix-profile engine (observer/phases.py has a numpy fallback); hmmlearn/ruptures have no py3.14 wheels
dashboard = ["websockets", "imageio-ffmpeg"]   # live map view relay (observer/stream.py), screen recording
cloud = ["modal", "openai"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["intercycle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
