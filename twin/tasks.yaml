inspection:
  defect_rate: 0.25
  zoom_max: 20.0
  detectability: 'A capture passes Inspect iff ALL of: (1) in_image: the target point is inside the zoomed frame after the
    PTZ aim (aim error N(0, 2.5 deg) per axis, re-centred by the PTZ before the shot); (2) unoccluded: the 3-D line of sight
    from the camera to the target is not cut by the static mesh or a mover; (3) incidence theta < 60 deg (theta = angle between
    the reversed line of sight and the target normal); (4) blur b < 1 px with b = (|v_perp| / R + |omega|) * f0 * Z * t_exp,
    t_exp = 4 ms; (5) DORI Inspect: px_per_m = f0 * Z / R * cos(theta) >= 1000 px/m (1 px per mm, Amendment 1), with f0 =
    1371.0 px (1920 px, 70 deg HFOV at Z = 1), Z = the checkpoint''s optical zoom (1..20), R = camera-target range (m). A
    thermal checkpoint also needs the thermal capture to pass (thermal_model). Defects: each (checkpoint, mission) carries
    a defect with probability defect_rate = 0.25 (keyed draw world/day/checkpoint, CRN across conditions); a capture that
    passes Inspect resolves it (present or absent, no false call: 1 mm class defects need >= 1 px/mm); a capture that fails,
    a declined or an unattempted checkpoint resolves nothing and scores 0. No partial credit.'
  capture_model: 'Same 20x optical zoom PTZ head in every condition (E-W3): 1920 x 1080 px, HFOV 70 deg / Z (Z = 1..20, f
    = f0 * Z, f0 = 1371.0 px), mounted at (0.45, 0, 0.35) m on the body; the shot is taken after the body has been still for
    1.0 s (|v| < 0.05 m/s, |omega| < 0.05 rad/s), else at dwell_end (settled = false). A boundary capture fails only on line
    of sight, incidence or blur, never on range at Z = 20 inside the zone (R <= 13.7 m keeps 2000 px/m at theta = 0).'
  thermal_model: 'Radiometric LWIR core on the same head, 640 x 512 px, HFOV 24 deg, no zoom: f_th = 320 / tan(12 deg) = 1505.5
    px. Thermal pass iff in_image (frame 640 x 512 at the same aim), unoccluded, theta < 60 deg, b_th = (|v_perp| / R + |omega|)
    * f_th * 10 ms < 1 px, and px_per_m_th = f_th / R * cos(theta) >= 100 px/m (a 10 cm hot spot spans >= 10 px). ASSUMED
    (no plant thermal data): the hot-spot contrast is always above NETD.'
  window:
    kinds: [press_stop, stroke_gap]
    margin_s: 1.0
    definition: 'An inside_danger checkpoint may be entered only inside a press inspection window: (a) a press stop (the press
      is idle, not running a stroke, for the whole stay), or (b) a gap between strokes of length >= inside_s + margin_s, where
      inside_s = entry_m / v + dwell_s + entry_m / v (entry from the wait pose, dwell, exit; entry_m from compile.py, v =
      robot speed) and margin_s = 1.0 s (= compile.SAFETY_MARGIN_S). The window must be open from the moment the robot crosses
      into the dilated danger rect until it has left it; a stroke starting with the robot inside is a robot-caused hold or
      trip.'
