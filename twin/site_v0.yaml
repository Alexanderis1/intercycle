# twin/site_v0.yaml - G0 PLACEHOLDER geometry (contract twin.site/1, twin/schemas/site.py).
# Every value is `source: prior`: nothing here was measured. CAL v0 (S2) replaces it by tracing train keyframes
# through the user-clicked calibration (k1 per framing, H scaled by the 4 m mount prior); site.yaml (S2) supersedes
# this file. Plan frame: x, z in metres; pixels (u, v) in the native 1920x1080 image. Floor outside a zone's
# floor_polygon is unseen and is a wall.
# Placeholder H: an affine map of the whole image onto the zone rectangle (x = x0 + u*W/1920, z = z0 + (1080-v)*D/1080).
contract: twin.site/1
site_id: esk_press_v0
frame: plan_xz_m
scale:
  value: {lo: 0.8, mid: 1.0, hi: 1.2}
  source: prior
  note: "P6 prior; replaced by the CAL v1 interval"
cal_sources: []
framings:
  - id: cam9_f0
    camera: 9
    image_size_px: {value: [1920, 1080], source: prior}
    K:
      value: [[1330.0, 0.0, 960.0], [0.0, 1330.0, 540.0], [0.0, 0.0, 1.0]]
      source: prior
      note: "f from the vendor VFOV (range 1020-1430 px), principal point at the image centre"
    k1: {value: 0.0, source: prior}
    H_img_to_floor:
      value: [[0.0072916666666666667, 0.0, 0.0], [0.0, -0.0092592592592592593, 10.0], [0.0, 0.0, 1.0]]
      source: prior
    mount_height_m: {value: 4.0, source: prior}
  - id: cam14_f0
    camera: 14
    image_size_px: {value: [1920, 1080], source: prior}
    K:
      value: [[1330.0, 0.0, 960.0], [0.0, 1330.0, 540.0], [0.0, 0.0, 1.0]]
      source: prior
    k1: {value: 0.0, source: prior}
    H_img_to_floor:
      value: [[0.0041666666666666667, 0.0, 30.0], [0.0, -0.0074074074074074074, 8.0], [0.0, 0.0, 1.0]]
      source: prior
    mount_height_m: {value: 4.0, source: prior}
zones:
  - id: z9
    camera: 9
    framings: [cam9_f0]
    floor_polygon: {value: [[0.0, 0.0], [14.0, 0.0], [14.0, 10.0], [0.0, 10.0]], source: prior}
  - id: z14
    camera: 14
    framings: [cam14_f0]
    floor_polygon: {value: [[30.0, 0.0], [38.0, 0.0], [38.0, 8.0], [30.0, 8.0]], source: prior}
presses:
  - id: P9a
    zone: z9
    footprint: {value: [[5.0, 6.0], [7.5, 6.0], [7.5, 8.5], [5.0, 8.5]], source: prior}
    ram_roi:
      value:
        - framing: cam9_f0
          polygon_px: [[800.0, 200.0], [920.0, 200.0], [920.0, 300.0], [800.0, 300.0]]
      source: prior
    danger_polygon: {value: [[4.8, 5.0], [7.7, 5.0], [7.7, 6.0], [4.8, 6.0]], source: prior}
    dilation_m: {value: 0.3, source: prior, note: "CAL v1 sets it to the p95 reprojection error"}
  - id: P14a
    zone: z14
    footprint: {value: [[33.0, 5.0], [35.5, 5.0], [35.5, 7.2], [33.0, 7.2]], source: prior}
    ram_roi:
      value:
        - framing: cam14_f0
          polygon_px: [[960.0, 180.0], [1080.0, 180.0], [1080.0, 280.0], [960.0, 280.0]]
      source: prior
    danger_polygon: {value: [[32.8, 4.0], [35.7, 4.0], [35.7, 5.0], [32.8, 5.0]], source: prior}
    dilation_m: {value: 0.3, source: prior}
