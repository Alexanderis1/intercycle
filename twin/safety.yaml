# twin/safety.yaml - guard type per press, reset distribution, entry rules (contract twin.safety/1,
# twin/schemas/safety.py; owner S5a + user; U4, W-W4, R-W2). Read by twin/plant.py.
# U4 (user, Sat ~21:10): guard types cannot be seen from 4 m, so EVERY press is ASSUMED: a light curtain with manual
# reset, reset time lognormal median 240 s, p90 900 s; the 60-900 s sweep is descriptive only.
# Entry rules (what the safety system does when the robot ENTERS the dilated danger polygon in a press state):
#   running   -> trip  (light curtain broken while the press runs: protective stop, manual reset from outside)
#   stopped   -> allow (no effect at entry; a restart that falls due while the robot is inside is HELD)
#   idle      -> hold  (the engine never emits idle; kept for the contract)
#   tripped / held / resetting -> hold (the press may not restart while the robot is inside; a reset starts
#                                        only after the robot has left)
contract: twin.safety/1
site_id: esk_press_v0
presses:
- press: P9a
  guard: {type: ASSUMED, device: light_curtain, reset: manual}
  reset:
    family: lognormal
    median_s: 240.0
    p90_s: 900.0
    sweep_s: {lo: 60.0, hi: 900.0}
  entry_rules: &rules
  - {press_state: running, action: trip}
  - {press_state: idle, action: hold}
  - {press_state: stopped, action: allow}
  - {press_state: tripped, action: hold}
  - {press_state: held, action: hold}
  - {press_state: resetting, action: hold}
- press: P14a
  guard: {type: ASSUMED, device: light_curtain, reset: manual}
  reset:
    family: lognormal
    median_s: 240.0
    p90_s: 900.0
    sweep_s: {lo: 60.0, hi: 900.0}
  entry_rules: *rules
