  - {press_state: idle, action: hold}
  - {press_state: stopped, action: allow}
  - {press_state: tripped, action: hold}
  - {press_state: held, action: hold}
  - {press_state: resetting, action: hold}
- press: P14a
  guard:
    type: OBSERVED
    device: fixed_fence
    reset: auto
    evidence_clips: [c14_train_0002]
  reset:
    family: lognormal
    median_s: 60.0
    p90_s: 180.0
    sweep_s: {lo: 30.0, hi: 300.0}
  entry_rules: *id001
