# Golden fixture for twin.safety/1 (tests/test_twin_contracts.py). Synthetic values, not real data.
contract: twin.safety/1
site_id: fixture_site
presses:
- press: P9a
  guard: {type: ASSUMED, device: light_curtain, reset: manual}
  reset:
    family: lognormal
    median_s: 240.0
    p90_s: 900.0
    sweep_s: {lo: 60.0, hi: 900.0}
  entry_rules: &id001
